#################################
#      APPEARANCE SETTINGS      #
#################################

workspace_layout tabbed

set $systemFont "pango:Kelmscott Mono, Iosevka, Fontawesome, 12"
set $barFont "pango:Kelmscott Mono, Iosevka, Fontawesome, 14"
font $systemFont

################################
#       DISPLAY: WINDOWS       #
################################
default_border pixel 3
default_floating_border pixel 0
smart_borders on
titlebar_border_thickness 2
titlebar_padding 7

title_align left

###############################
#       DISPLAY: COLORS       #
###############################

set $clr-focus #007171
set $clr-urgent #990000
set $clr-text #212121
set $clr-unfocused #e4d8c4
set $clr-unfocused-text #302c26
set $clr-transparent #00000000
set $clr-background #fdf6e3

#<border> <background> <text> <indicator> [<child_border>]
# ff is opaque, 00 is transparent

client.focused    $clr-background $clr-focus $clr-background $clr-focus $clr-focus
client.urgent     $clr-background $clr-urgent $clr-background $clr-urgent $clr-urgent
client.unfocused  $clr-background $clr-unfocused $clr-unfocused-text $clr-unfocused $clr-unfocused
client.focused_inactive  $clr-background $clr-unfocused $clr-unfocused-text $clr-unfocused $clr-unfocused

bar {
   swaybar_command waybar
}

# vim: set ft=swayconfig :
